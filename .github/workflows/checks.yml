name: Checks

# Everything a release needs to build: versions, page scripts, every core test, and the server image's
# program compiled for both Intel and ARM.

# Run by hand only (Actions → Checks → Run workflow): GitHub's monthly build minutes are limited, so
# day to day the same checks run locally with `python tools/release_ci.py verify`.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to check"
        type: choice
        options: [everything, secrets, sites]
        default: everything

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: inputs.what == 'everything'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Versions, page scripts, core tests and the server
        run: python3 tools/release_ci.py verify --quick

  server-image:
    if: inputs.what == 'everything'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Only the stage that compiles: it runs on this machine for both, with no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: build
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=checks
          cache-to: type=gha,scope=checks,mode=max

  # Whether the build secrets are set and well formed, without showing them.
  secrets:
    if: inputs.what != 'sites'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Built-in Google connection (GOOGLE_CLIENT_JSON)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          t = os.environ.get("GOOGLE_CLIENT_JSON", "").strip()
          if not t:
              print("::error::GOOGLE_CLIENT_JSON isn't set"); sys.exit(1)
          try:
              d = json.loads(t)
          except Exception:
              print("::error::GOOGLE_CLIENT_JSON isn't valid JSON: paste the whole file, from { to }"); sys.exit(1)
          c = d.get("installed") or d.get("web")
          if not c:
              print("::error::GOOGLE_CLIENT_JSON isn't a Google OAuth client file"); sys.exit(1)
          if "installed" not in d:
              print("::error::GOOGLE_CLIENT_JSON is a Web client; Job Hunt needs a Desktop app client"); sys.exit(1)
          missing = [k for k in ("client_id", "client_secret") if not c.get(k)]
          if missing:
              print(f"::error::GOOGLE_CLIENT_JSON has no {' or '.join(missing)}: download it again (Add secret first if needed)"); sys.exit(1)
          print(f"::notice::GOOGLE_CLIENT_JSON is a Desktop client for project {c.get('project_id', '?')}, ready to build in")
          PY
      - name: Update signing key (TAURI_SIGNING_PRIVATE_KEY)
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$K" ] && echo "::notice::TAURI_SIGNING_PRIVATE_KEY is set" || echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn''t set"'

  # What each recruiter and job site answers when Job Hunt reads it (the cloud sessions can't reach them).
  sites:
    if: inputs.what == 'sites'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Employers' careers sites (which system, and whether Job Hunt reads it)
        if: always()
        working-directory: core
        run: cargo run --quiet --example employer_check -- "Accountant"
      - name: Each site, read the way a search reads it
        working-directory: core
        run: cargo run --quiet --example site_check -- "Accountant" "Toronto, ON"
      - name: TLS of the sites that can't be reached
        if: always()
        run: |
          for h in jobs.lrostaffing.com; do
            echo "== $h"
            echo | openssl s_client -connect $h:443 -servername $h -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|Protocol|Cipher is|Verify return|Verification" | head -20
            curl -sS -o /dev/null -w "curl: %{http_code} %{ssl_verify_result}\n" https://$h/job-listings/ || true
          done
      - name: Each site in a real browser (as the Windows app reads them)
        if: always()
        run: |
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          node tools/render_sites.js
      - name: What each site answers
        if: always()
        run: python3 tools/probe_sites.py "Tax Manager" "Toronto, ON"
