name: Release Job Hunt for Windows

# A change to VERSION on the redesign branch is a release. Everything is
# tested on Windows before anything is published. Versions are dated: year.month.count.
on:
  push:
    branches: [redesign]
    paths: ["VERSION", ".github/workflows/release.yml"]
  # A release whose tests failed is tried again by fixing the cause and running this by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: v
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          # Versions are dated: year.month.count, such as 26.11.22. The count
          # goes up by one with each release and starts at 0 in a new month.
          if ! [[ "$v" =~ ^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then echo "VERSION must be year.month.count such as 26.11.22, not '$v'"; exit 1; fi
          top=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## *//' | tr -d ' \r')
          if [ "$top" != "$v" ]; then echo "The top of CHANGELOG.md describes $top, VERSION says $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already published: nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # A new version comes after every version already published.
            newest=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Ev '^v[0-9]\.' | sed 's/^v//' | sort -V | tail -1 || true)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -1)" != "$v" ]; then echo "$v does not come after $newest, which is already published"; exit 1; fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.publish == 'true'
        with:
          go-version-file: go.mod

      - name: Tests, on Windows
        if: steps.v.outputs.publish == 'true'
        shell: bash
        run: go vet ./... && go test ./...

      - name: Build the program
        if: steps.v.outputs.publish == 'true'
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X jobhunt/internal/api.Version=${{ steps.v.outputs.version }}" -o dist/JobHunt3.exe ./cmd/jobhunt

      - name: Build the installer
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          # NSIS comes with the code (installer/tools), checked against its known fingerprint, so
          # building the installer never depends on a download site being up.
          $zip = "installer\tools\nsis-3.10.zip"
          $want = "fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $want) { throw "installer\tools\nsis-3.10.zip is not the NSIS it should be" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
          $nsis = "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "the installer builder (NSIS) is not on this machine" }
          & $nsis /V2 "/DVERSION=${{ steps.v.outputs.version }}" "/DEXE=..\dist\JobHunt3.exe" "/DOUT=..\dist\JobHunt3-Setup.exe" "/DEXT=..\extension" installer\jobhunt.nsi
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Write-Host "Installer: $([math]::Round((Get-Item dist\JobHunt3-Setup.exe).Length / 1MB, 1)) MB"

      - name: Install it, start it, update over it, remove it
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:LOCALAPPDATA\Programs\Job Hunt 3"
          $exe = "$dir\JobHunt3.exe"
          $env:JOBHUNT_HOME = "$env:RUNNER_TEMP\jobhunt-trial"
          function Running { [bool](Get-Process JobHunt3 -ErrorAction SilentlyContinue) }
          function State {
            for ($i = 0; $i -lt 40; $i++) {
              try { return Invoke-RestMethod "http://127.0.0.1:47700/api/state" -TimeoutSec 3 } catch { Start-Sleep -Milliseconds 500 }
            }
            throw "Job Hunt did not answer on this computer"
          }

          # 1. A silent install puts everything in place.
          Start-Process dist\JobHunt3-Setup.exe -ArgumentList "/S" -Wait
          if (-not (Test-Path $exe)) { throw "the program was not installed" }
          if (-not (Test-Path "$dir\extension\manifest.json")) { throw "the side panel's files were not installed" }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw "there is no uninstaller" }
          $start = [Environment]::GetFolderPath("Programs")
          if (-not (Test-Path "$start\Job Hunt 3.lnk")) { throw "there is no Start menu shortcut" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Job Hunt 3.lnk")) { throw "there is no desktop shortcut" }
          $un = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\JobHunt3"
          if ($un.DisplayVersion -ne "${{ steps.v.outputs.version }}") { throw "Windows' list of apps shows version '$($un.DisplayVersion)'" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").JobHunt3
          if ($run -notlike "*JobHunt3.exe* -no-window") { throw "starting with Windows is not set: '$run'" }
          $proto = (Get-ItemProperty "HKCU:\Software\Classes\jobhunt3\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          if ($proto -notlike "*JobHunt3.exe*%1*") { throw "notification clicks are not handed to Job Hunt: '$proto'" }
          Write-Host "Installed: program, side panel, shortcuts, uninstall entry, start with Windows, notification links"

          # 2. It starts, makes its data and says the right version.
          Start-Process $exe -ArgumentList "-no-window"
          $st = State
          if ($st.version -ne "${{ steps.v.outputs.version }}") { throw "the program says it is version '$($st.version)'" }
          if (-not (Test-Path "$env:JOBHUNT_HOME\jobhunt.db")) { throw "Job Hunt did not create its data" }
          $page = Invoke-WebRequest "http://127.0.0.1:47700/" -UseBasicParsing -TimeoutSec 5
          if ($page.Content -notmatch "Job Hunt") { throw "the first page did not load" }
          Write-Host "Started: version $($st.version), data created, pages served"
          # The icon by the clock and notifications must not stop the program. A build machine has
          # nobody signed in at a screen, so a notification that can't be shown is only noted.
          try { Invoke-RestMethod "http://127.0.0.1:47700/api/desk/test" -Method Post -Headers @{ "X-JobHunt" = "1" } -TimeoutSec 30 | Out-Null; Write-Host "A Windows notification was shown" } catch { Write-Host "Notification not shown here: $($_.ErrorDetails.Message)" }
          State | Out-Null

          # 3. Asked to stop, it stops.
          Start-Process $exe -ArgumentList "-quit" -Wait
          Start-Sleep -Seconds 1
          if (Running) { throw "Job Hunt was asked to stop and is still running" }
          Write-Host "Stopped when asked"

          # 3b. Its own window: it opens, it is Job Hunt's own and not a browser's, a second start
          #     brings it forward instead of starting twice, and it comes back where it was left.
          $wv = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $hasWv = (Test-Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv") -or (Test-Path "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv") -or (Test-Path "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$wv")
          if (-not $hasWv) { Write-Host "This machine has no WebView2, so the window was not tried here" } else {
            Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class JHWin {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int hh, bool r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          }
          "@
            function Win { for ($i = 0; $i -lt 80; $i++) { $h = [JHWin]::FindWindowW("webview", "Job Hunt"); if ($h -ne [IntPtr]::Zero) { return $h }; Start-Sleep -Milliseconds 500 }; return [IntPtr]::Zero }
            Start-Process $exe
            State | Out-Null
            $h = Win
            if ($h -eq [IntPtr]::Zero) { throw "Job Hunt's own window did not open" }
            $log = "$env:JOBHUNT_HOME\debug.log"
            $shown = $false
            for ($i = 0; $i -lt 90 -and -not $shown; $i++) { Start-Sleep -Milliseconds 500; $shown = [bool](Select-String -Path $log -Pattern "window.*showing" -ErrorAction SilentlyContinue) }
            if (-not $shown) {
              Get-Content $log -Tail 40 -ErrorAction SilentlyContinue | Write-Host
              Get-Process | Where-Object { $_.Name -match "webview|JobHunt|msedge" } | Format-Table Name, Id | Out-String | Write-Host
              throw "the window opened with nothing inside it"
            }
            $h = Win
            if ($h -eq [IntPtr]::Zero) { throw "Job Hunt's own window went away after opening" }
            Start-Process $exe -Wait
            if (@(Get-Process JobHunt3).Count -ne 1) { throw "starting Job Hunt twice left two copies running" }
            # A click on a notification: Windows starts Job Hunt with the page's link.
            Start-Process $exe -ArgumentList "jobhunt3://open/roles" -Wait
            Start-Sleep -Seconds 1
            if (-not (Select-String -Path $log -Pattern 'brought forward on "#/roles"' -SimpleMatch -ErrorAction SilentlyContinue)) { Get-Content $log -Tail 20 | Write-Host; throw "a notification's link did not open its page in the window" }
            if (@(Get-Process JobHunt3).Count -ne 1) { throw "a notification's link started a second copy" }
            [JHWin]::MoveWindow($h, 60, 50, 1000, 700, $true) | Out-Null
            Start-Sleep -Seconds 2
            Start-Process $exe -ArgumentList "-quit" -Wait
            Start-Sleep -Seconds 1
            if (Running) { throw "Job Hunt with its window open was asked to stop and is still running" }
            if (-not (Test-Path "$env:JOBHUNT_HOME\window.json")) { throw "where the window was is not written down" }
            Start-Process $exe
            State | Out-Null
            $h = Win
            if ($h -eq [IntPtr]::Zero) { throw "Job Hunt's window did not open the second time" }
            Start-Sleep -Seconds 6
            $r = New-Object JHWin+RECT
            [JHWin]::GetWindowRect($h, [ref]$r) | Out-Null
            Write-Host "Window came back at $($r.L),$($r.T) size $($r.R - $r.L)x$($r.B - $r.T) (left at 60,50 size 1000x700)"
            if ([math]::Abs($r.L - 60) -gt 2 -or [math]::Abs($r.T - 50) -gt 2 -or [math]::Abs($r.R - $r.L - 1000) -gt 2 -or [math]::Abs($r.B - $r.T - 700) -gt 2) { throw "the window did not come back where it was left" }
            Start-Process $exe -ArgumentList "-quit" -Wait
            Start-Sleep -Seconds 1
            Write-Host "Own window: opens, one copy only, remembers its place and size"
          }

          # 4. Installing over a running copy (an update) stops it, replaces it and keeps the data.
          Start-Process $exe -ArgumentList "-no-window"
          State | Out-Null
          Start-Process dist\JobHunt3-Setup.exe -ArgumentList "/S" -Wait
          if (Running) { throw "the installer left the old copy running" }
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash dist\JobHunt3.exe).Hash) { throw "the installed program is not the one just built" }
          if (-not (Test-Path "$env:JOBHUNT_HOME\jobhunt.db")) { throw "the update removed the data" }
          Start-Process $exe -ArgumentList "-no-window"
          State | Out-Null
          Write-Host "Updated over a running copy; data kept; starts again"

          # 4b. The way Job Hunt updates itself: quietly, keeping the person's choices, and starting again by itself.
          Remove-Item "$([Environment]::GetFolderPath('Desktop'))\Job Hunt 3.lnk"
          Remove-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name JobHunt3
          # The window was open when the update began: it must come back afterwards.
          if ($hasWv) { Set-Content "$env:JOBHUNT_HOME\reopen-window" "1" }
          # Not -Wait: that would also wait for Job Hunt, which the installer starts again.
          (Start-Process dist\JobHunt3-Setup.exe -ArgumentList "/S", "/UPDATE" -PassThru).WaitForExit()
          $st = State
          if ($hasWv) { if ((Win) -eq [IntPtr]::Zero) { throw "after updating itself Job Hunt did not open its window again" }; Write-Host "Self-update: the window came back" }
          if ($st.version -ne "${{ steps.v.outputs.version }}") { throw "after updating itself the program says it is version '$($st.version)'" }
          if (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Job Hunt 3.lnk") { throw "a self-update put back the desktop shortcut the person removed" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").JobHunt3) { throw "a self-update turned starting with Windows back on" }
          if (-not $st.can_install) { throw "the installed copy says it cannot update itself" }
          Write-Host "Self-update: quiet, kept the person's choices, came back by itself"

          # 5. Removing it stops it and takes everything out except the person's data.
          Start-Process "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          if (Running) { throw "removing Job Hunt left it running" }
          if (Test-Path $exe) { throw "removing Job Hunt left the program behind" }
          if (Test-Path "$start\Job Hunt 3.lnk") { throw "removing Job Hunt left its Start menu shortcut" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\JobHunt3") { throw "removing Job Hunt left its entry in Windows' list of apps" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").JobHunt3) { throw "removing Job Hunt left it starting with Windows" }
          if (Test-Path "HKCU:\Software\Classes\jobhunt3") { throw "removing Job Hunt left its notification links registered" }
          if (-not (Test-Path "$env:JOBHUNT_HOME\jobhunt.db")) { throw "removing Job Hunt deleted the data" }
          Write-Host "Removed cleanly; data left alone"

      - name: Scan with Windows Defender
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "Defender is not on this machine"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          & $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation | Out-Host
          $code = $LASTEXITCODE
          if ($code -eq 2) { throw "Windows Defender flagged the build; not publishing it" }
          if ($code -ne 0) { Write-Warning "the Defender scan ended with $code" } else { Write-Host "Defender: nothing found" }
          exit 0

      - name: Publish
        if: steps.v.outputs.publish == 'true'
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          # The top section of CHANGELOG.md is this version's notes.
          awk -v want="## $v" '$0 == want {on=1; next} /^## / {on=0} on' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then echo "CHANGELOG.md has no section for $v"; exit 1; fi
          {
            echo
            echo "**To install:** download \`JobHunt3-Setup.exe\` below and run it. Windows may say the publisher is unknown, because the installer is not signed: choose **More info**, then **Run anyway**."
            echo
            echo "Built from ${GITHUB_SHA::7}. Tested on Windows (installed, started, updated, removed) and scanned with Windows Defender."
            echo
            echo "SHA-256 of JobHunt3-Setup.exe: \`$(sha256sum dist/JobHunt3-Setup.exe | cut -d' ' -f1)\`"
          } >> dist/notes.md
          gh release create "v$v" dist/JobHunt3-Setup.exe --title "Job Hunt $v" --notes-file dist/notes.md --target "$GITHUB_SHA" --latest
