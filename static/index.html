<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Hunt</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<!-- Added to a phone's home screen, it opens like an app: full screen, with its own icon. -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Hunt">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121829">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div class="app">
  <!-- On a phone: a slim bar on top (find, and a menu button for Settings and status), the five places as tabs at the bottom. -->
  <header class="mtop">
    <a class="mbrand" href="#overview"><img src="/static/logo.svg" alt="" width="26" height="26"><b>Job Hunt</b></a>
    <a class="mstatus" href="#overview"><span class="dot" id="mDot"></span><span id="mNote"></span></a>
    <button type="button" class="mbtn" data-act="palette" aria-label="Find a job"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <button type="button" class="mbtn" id="mMenu" data-act="moreMenu" aria-label="Settings and status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <!-- The bar across the top: the five places, find, what Job Hunt is doing (and its status lines), Settings.
       On a phone it's the sheet the top bar's menu button opens. -->
  <aside class="side">
    <a class="brand" href="#overview">
      <img src="/static/logo.svg" alt="" width="38" height="38">
      <span><strong>Job Hunt</strong></span>
    </a>
    <nav class="main" id="nav" aria-label="Sections"></nav>
    <button class="find-box side-find" data-act="palette" title="Find any job (Ctrl+K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Find a job…</span><kbd>Ctrl K</kbd></button>
    <details class="menu status-pop" id="statusPop">
      <summary class="status-pill" id="runLine"><span class="dot" id="dotRun"></span><span id="runNote">Idle</span></summary>
      <div class="menu-list right side-foot">
        <div class="update-note" id="updateNote" hidden></div>
        <a class="status" href="#search" id="searchLine"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>What the search found</span></a>
        <a class="status" href="#settings/connections" id="googleLine"><span class="dot" id="dotGoogle"></span><span id="googleNote">Google not connected</span></a>
        <a class="status" href="#settings/sync" id="syncLine"><span class="dot" id="dotSync"></span><span id="syncNote"></span></a>
        <a class="status warn-line" href="#settings/connections" id="limitLine" hidden><span class="dot warn"></span><span id="limitNote"></span></a>
        <a class="status warn-line" href="#settings/connections" id="connLine" hidden><span class="dot warn"></span><span id="connNote"></span></a>
      <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="Appearance">
        <button type="button" role="radio" data-theme-pick="auto" title="Match Windows"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Auto</span></button>
        <button type="button" role="radio" data-theme-pick="light" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span>Light</span></button>
        <button type="button" role="radio" data-theme-pick="dark" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Dark</span></button>
      </div>
        <a class="muted side-version" href="#settings/app" id="versionNote" title="What's new">Job Hunt</a>
      </div>
    </details>
    <a class="side-settings" id="settingsLink" href="#settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
  </aside>
  <main id="main" tabindex="-1"><div class="page"><p class="muted">Loading…</p></div></main>
</div>
<aside id="jobPanel" class="job-panel" aria-label="The job you opened" hidden></aside>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/clip.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
