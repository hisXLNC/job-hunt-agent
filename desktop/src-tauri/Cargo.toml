[package]
name = "jobhunt"
version = "1.44.0"
description = "Job Hunt: finds roles, tailors your CV, tracks applications, triages email and books interviews"
authors = ["Job Hunt"]
edition = "2021"
publish = false

[lib]
name = "jobhunt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jobhunt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jobhunt-core = { path = "../../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
url = "2"
percent-encoding = "2"
arboard = { version = "3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
